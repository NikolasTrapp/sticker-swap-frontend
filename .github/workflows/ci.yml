name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-sonar:
    name: Build, test and Sonar
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:prod

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/sticker-swap-frontend
          retention-days: 7

      - name: Add coverage to job summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'coverage/sticker-swap-frontend/coverage-summary.json';

          if (!fs.existsSync(path)) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '## Coverage\n\nCoverage summary not found.\n'
            );
            process.exit(0);
          }

          const total = JSON.parse(fs.readFileSync(path, 'utf8')).total;

          const rows = [
            ['Statements', total.statements],
            ['Branches', total.branches],
            ['Functions', total.functions],
            ['Lines', total.lines],
          ];

          const markdown = [
            '## Coverage',
            '',
            '| Metric | Coverage | Covered / Total |',
            '| --- | ---: | ---: |',
            ...rows.map(([label, metric]) => `| ${label} | ${metric.pct}% | ${metric.covered} / ${metric.total} |`),
            '',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          NODE

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
