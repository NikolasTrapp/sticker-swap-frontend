name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        # O base-href pega o nome do seu repositório dinamicamente. Ex: /sticker-swap-frontend/
        run: npx ng build --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Prepare prod config and SPA routing
        run: |
          # 1. Substitui o config.json pelo config.prod.json
          cp dist/sticker-swap-frontend/browser/assets/config.prod.json dist/sticker-swap-frontend/browser/assets/config.json
          
          # 2. Copia index para 404 para suportar as rotas no GitHub Pages
          cp dist/sticker-swap-frontend/browser/index.html dist/sticker-swap-frontend/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sticker-swap-frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
