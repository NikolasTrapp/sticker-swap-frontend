name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sticker-swap-frontend/package-lock.json
      - name: Install
        working-directory: sticker-swap-frontend
        run: npm ci
      - name: Build
        working-directory: sticker-swap-frontend
        run: npm run build:prod
